version: "3.1"

intents:
  - cumprimentar
  - despedida
  - humor_feliz
  - humor_triste
  - desafio_bot
  - perguntar_gemma
  - fornecer_nome
  - utter_saudacao_com_nome
  - action_listen
  - action_restart
  - action_session_start
  - action_default_fallback
  - action_default_ask_affirmation
  - action_default_ask_rephrase
  - action_two_stage_fallback
  - action_unlikely_intent
  - action_back
  - action_extract_slots
  - action_call_gemma
  - action_1
  - action_2
  - agradecer
  - perguntar_hora
  - perguntar_data
  - ver_status_servidor
  - atualizar_sistema
  - verificar_tempo
  - abrir_calculadora
  - abrir_navegador
  - reiniciar_servidor
  - elogiar
  - perguntar_nome
  - modo_debug

entities:
  - nome

slots:
  nome:
    type: text
    influence_conversation: false # Garantir que o slot não influencie a conversa
    mappings:
      - type: from_entity
        entity: nome

actions:
  - utter_saudacao_com_nome
  - action_call_gemma
  - action_saudacao_com_nome
  - action_1
  - action_2
  - action_ver_status_servidor
  - action_atualizar_sistema
  - action_reiniciar_servidor
  - action_dizer_hora
  - action_dizer_data
  - action_abrir_calculadora
  - action_abrir_navegador
  - action_verificar_tempo

custom_actions:
  - action_saudacao_com_nome

responses:
  utter_cumprimentar:
    - text: "Olá! Como posso te ajudar?"
    - text: "Oi Senhor, Como posso ajudar?"

  utter_despedida:
    - text: "Tchau! Até mais!"

  utter_feliz:
    - text: "Que bom! Fico feliz por você. 😊"

  utter_triste:
    - text: "Sinto muito por isso. Quer conversar sobre o que está acontecendo?"

  utter_desafio_bot:
    - text: "Eu sou um assistente inteligente! Como posso ajudar?"

  utter_ajuda: 
    - text: "Claro! Como posso te ajudar?"

  utter_saudacao_com_nome:
    - text: "Olá, {nome}, como posso ajudar?"
    - text: "Oi, {nome}, em que posso te ajudar?"
    - text: "Olá, tudo bem, {nome}? Como posso te auxiliar?"
  
  utter_agradecer:
    - text: "De nada! Estou aqui pra ajudar."
  utter_perguntar_nome:
    - text: "Sou sua assistente virtual. Fui criada para te ajudar no que for possível!"
  utter_elogiar:
    - text: "Muito obrigada! Fico feliz em ajudar."
  utter_verificar_tempo:
    - text: "Vou verificar a previsão do tempo, só um momento..."
  utter_modo_debug:
    - text: "Modo debug ativado. Logs detalhados serão exibidos."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true